<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartReq · API client</title>
    <meta name="description" content="SmartReq is a browser-based API client for single requests, data-driven bulk runs, request flows and endpoint discovery." />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f8fa" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('api-client-theme') || 'dark';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.classList.add(t);
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
